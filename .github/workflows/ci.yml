name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Format Check
        run: npx prettier --check .

      - name: Lint Check
        run: npx eslint . --ext ts,tsx --max-warnings 0

      - name: Type Check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
